<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="David Jeremie Anand">
  <!-- Three spectral ribbons, drifting the way the carriers do in the
       waterfall behind the site's title. Warm at the top, cooling
       downward; the bands run past the tile edge and are clipped, so the
       mark reads as a window onto something continuous rather than a
       closed shape. -->
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC978"/><stop offset=".55" stop-color="#FFB454"/><stop offset="1" stop-color="#F08A6A"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9BCCE"/><stop offset=".55" stop-color="#F5A8C0"/><stop offset="1" stop-color="#E2679F"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4479A"/><stop offset=".55" stop-color="#B03A82"/><stop offset="1" stop-color="#8E2F52"/>
    </linearGradient>
    <clipPath id="rc"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0A0E16"/>

  <g clip-path="url(#rc)" fill="none" stroke-linecap="round" stroke-width="9.5">
    <path d="M-6 21 C10 21 14 9 32 9 C50 9 54 21 70 21" stroke="url(#r1)"/>
    <path d="M-6 39 C10 39 14 27 32 27 C50 27 54 39 70 39" stroke="url(#r2)"/>
    <path d="M-6 57 C10 57 14 45 32 45 C50 45 54 57 70 57" stroke="url(#r3)"/>
  </g>
</svg>
