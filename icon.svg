<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="David Jeremie Anand">
  <!-- DJA monogram. The A dominates and carries the site's spectral
       gradient; D and J stack beside it in plasma. Letterforms are drawn
       geometrically rather than set in a typeface, so the mark renders
       identically everywhere instead of depending on installed fonts. -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8E2F52"/>
      <stop offset=".42" stop-color="#D4479A"/>
      <stop offset=".72" stop-color="#F5A8C0"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0A0E16"/>

  <g fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 52 L40 12 L55 52 M29.5 41 H50.5"/>
  </g>

  <g fill="none" stroke="#E2679F" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 13 V30 M9 13 H13.5 A8.5 8.5 0 0 1 13.5 30 H9"/>
    <path d="M20 35 V48 A5 5 0 0 1 10 48"/>
  </g>
</svg>
