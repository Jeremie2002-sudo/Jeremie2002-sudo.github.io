<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="David Jeremie Anand">
  <!-- Four spectral bars in the site's own ramp: wine, plasma, blush, ember.
       Reads as a spectrum display rather than a monogram, which keeps it
       legible at 16px where two or three letters would turn to mush. -->
  <rect width="64" height="64" rx="14" fill="#0A0E16"/>
  <g>
    <rect x="12" y="34" width="7" height="18" rx="3.5" fill="#8E2F52"/>
    <rect x="23" y="22" width="7" height="30" rx="3.5" fill="#D4479A"/>
    <rect x="34" y="12" width="7" height="40" rx="3.5" fill="#F5A8C0"/>
    <rect x="45" y="27" width="7" height="25" rx="3.5" fill="#FFB454"/>
  </g>
</svg>
